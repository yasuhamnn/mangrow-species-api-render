# Render Blueprint for Mangrow Species + Health API
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mangrow-species-api-render-1
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ROBOFLOW_BASE_URL
        value: "https://serverless.roboflow.com"
      - key: ROBOFLOW_HEALTH_MODEL
        value: "crmc-rosejane-mahusay/mangrove_species_diseases-tnqrq-dd8ac-3-yolo11n-t1"
      - key: ROBOFLOW_TIMEOUT_S
        value: "20"
      - key: ROBOFLOW_UNCERTAIN_CONF
        value: "0.55"
      - key: ROBOFLOW_API_KEY
        sync: false
